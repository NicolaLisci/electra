{{ define "main" }}
  {{ partial "page-header.html" . }}

  <section class="section">
    <div class="container">
      <div class="row faq-list">
        {{ range sort .Pages "Params.weight" }}
          <div class="faq-item col-12 mb-4">
            <h3 class="faq-question">{{ .Title }}</h3>
            <div class="faq-answer">
              {{ .Content }}
            </div>
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
